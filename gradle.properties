# Project-wide Gradle settings.
# IDE settings override values in this file.
# https://docs.gradle.org/current/userguide/build_environment.html

# --- JVM / Daemon ---
# Prefer a JDK 17+ on PATH, or Android Studio's bundled JBR.
# Optional (machine-local): uncomment and set your JBR path if CLI builds fail:
# org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# --- Build speed ---
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false
org.gradle.daemon=true

# --- Android / Kotlin ---
android.useAndroidX=true
android.nonTransitiveRClass=true
# Required for KSP with AGP 9 built-in Kotlin
android.disallowKotlinSourceSets=false
kotlin.code.style=official
kotlin.incremental=true
ksp.incremental=true
ksp.incremental.log=false
